<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14171a"/>
      <stop offset="100%" stop-color="#0a0b0c"/>
    </linearGradient>

    <linearGradient id="stroke" x1="120" y1="352" x2="392" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ed15a"/>
      <stop offset="100%" stop-color="#b8f793"/>
    </linearGradient>

    <radialGradient id="dot" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e3e9ee"/>
    </radialGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2"/>

  <!-- subtle radial sheen behind the mark -->
  <ellipse cx="256" cy="230" rx="220" ry="170" fill="#6ed15a" opacity="0.05"/>

  <!-- trend line -->
  <path d="M118 356 L212 246 L280 292 L390 158"
        fill="none"
        stroke="url(#stroke)"
        stroke-width="36"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- endpoint node -->
  <g filter="url(#glow)">
    <circle cx="390" cy="158" r="26" fill="url(#dot)"/>
  </g>
  <circle cx="390" cy="158" r="26" fill="none" stroke="#0a0b0c" stroke-width="3" stroke-opacity="0.15"/>
</svg>
