<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090a09" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>Offline | MYLO Edge</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #090a09;
        color: #e8ecf2;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        text-align: center;
      }
      .mark {
        width: 44px; height: 44px; margin: 0 auto 22px;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 11px;
        display: grid; place-items: center;
      }
      code { color: #96e879; font-size: 13px; letter-spacing: 0.16em; }
      h1 { font-size: 19px; margin: 14px 0 10px; font-weight: 600; letter-spacing: -0.02em; }
      p { color: #9aa4b4; font-size: 13.5px; line-height: 1.6; max-width: 34ch; margin: 0 auto; }
      button {
        margin-top: 26px; min-height: 48px; padding: 0 22px;
        border-radius: 10px; border: 1px solid #2d332e;
        background: rgba(255,255,255,0.03); color: #e8ecf2;
        font: inherit; font-size: 14px; cursor: pointer;
      }
      button:hover { background: rgba(255,255,255,0.07); }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M4 17L9 11L13 14L20 6" stroke="#96e879" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="20" cy="6" r="2" fill="#e8ecf2"/>
        </svg>
      </div>
      <code>OFFLINE</code>
      <h1>No connection to market data.</h1>
      <p>MYLO Edge needs a connection for live market data and account sign-in. Cached pages are still available.</p>
      <button type="button" onclick="location.replace('./')">Retry</button>
    </main>
  </body>
</html>
